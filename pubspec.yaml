name: fl_lib
description: "Flutter lib for common use cases."
version: 0.0.1
homepage: https://github.com/lppcg/fl_lib
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.35.0"

dependencies:
  choice: ^2.3.2
  crypto: ^3.0.3
  dio: ^5.4.2+1
  extended_image: ^10.0.0
  file_picker: ^12.0.0
  flutter:
    sdk: flutter
  flutter_highlight: ^0.7.0
  flutter_localizations:
    sdk: flutter
  flutter_markdown_plus: ^1.0.7
  flutter_markdown_plus_latex: ^1.0.5
  flutter_secure_storage: ^10.0.0
  freezed_annotation: ^3.0.0
  hive_ce: ^2.11.3
  hive_ce_flutter: ^2.3.1
  icloud_storage_plus: ^4.0.0
  icons_plus:
    git:
      url: https://github.com/lollipopkit/icons_plus
      ref: main
  image: ^4.2.0
  intl: ^0.20.2
  json_annotation: ^4.9.0
  local_auth: ^3.0.0
  locale_names: ^1.1.1
  logging: ^1.2.0
  markdown: ^7.2.2
  mime: ^2.0.0
  multi_split_view: ^3.6.0
  path_provider: ^2.1.4
  pointycastle: ^4.0.0
  pretty_qr_code: ^3.3.0
  qr_code_dart_scan: ^0.14.0
  re_editor:
    git:
      url: https://github.com/lollipopkit/re-editor
      ref: main
  re_highlight: ^0.0.3
  share_plus: ^13.3.0
  shared_preferences: ^2.2.3
  # Bundled through Dart build hooks, so it adds no podspec and no
  # Package.swift. Which SQLite variant is compiled in is chosen by the root
  # app's `hooks.user_defines.sqlite3` — a dependency cannot set its own.
  sqlite3: ^3.5.1
  url_launcher: ^6.2.6
  flutter_riverpod: ^3.3.1
  responsive_framework: ^1.5.1
  riverpod_annotation: ^4.0.2
  webdav_client_plus: ^2.0.0
  window_manager: ^0.5.0
  computer:
    git:
      url: https://github.com/lollipopkit/dart_computer
      ref: v1.0.88
  flutter_staggered_grid_view: ^0.7.0

dependency_overrides:
#   webdav_client_plus:
#     path: ../webdav_client
# flutter_markdown_latex:
#   path: ../flutter_markdown_latex
  flutter_math_fork: ^0.7.4

dev_dependencies:
  build_runner: ^2.4.13
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  freezed: ^3.0.0
  json_serializable: ^6.8.0
  riverpod_generator: ^4.0.3
  riverpod_lint: ^3.1.3

flutter:
  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
  #
  generate: true
