    sdk: flutter

  cupertino_icons: ^1.0.8

  fl_lib:
    path: ../.

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

dependency_overrides:
  flutter_math_fork: ^0.7.4
